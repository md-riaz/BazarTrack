name: bazar
description: "সহজ বাজার খাতা — collaborative office market and expense manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  go_router: ^14.6.3

  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1

  dio: ^5.7.0

  connectivity_plus: ^6.1.0

  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0

  intl: ^0.19.0

  equatable: ^2.0.7
  uuid: ^4.5.1
  crypto: ^3.0.6
  flutter_dotenv: ^6.0.1
  json_annotation: ^4.9.0
  retrofit: 4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  json_serializable: ^6.8.0
  retrofit_generator: 9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/env/app.env
    - assets/images/
